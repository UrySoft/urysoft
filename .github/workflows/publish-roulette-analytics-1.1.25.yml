name: Publish Roulette Analytics 1.1.25

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-roulette-analytics-1.1.25.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APK: descargas/roulette-analytics/Roulette-Analytics-1.1.25.apk
      TAG: roulette-analytics-1.1.25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the signed installer digest
        run: echo "a76fbdbec1897fc7c80510881a80b10e24f239485b8370470f19c64d51823b85  $APK" | sha256sum -c -
      - name: Publish the Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --latest=false \
              --title "Roulette Analytics 1.1.25" \
              --notes "Descarga directa para Android. Acceso mediante usuario y contraseña y gestión de cuentas desde el panel web."
          fi
