name: Publish Minairo 6.35.1
on:
  push:
    branches: [main]
    paths:
      - 'release-parts/minairo-6.35.1/**'
      - '.github/workflows/publish-minairo-6.35.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify signed installer
        run: |
          cat release-parts/minairo-6.35.1/*.part > "$RUNNER_TEMP/Minairo-6.35.1.apk"
          echo 'c723bced486abacc2209a0c51cc5b3819cad2a458764d3cd1137f404d9136b09  '"$RUNNER_TEMP/Minairo-6.35.1.apk" | sha256sum -c -
      - name: Publish signed installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view minairo-6.35.1 >/dev/null 2>&1; then
            gh release upload minairo-6.35.1 "$RUNNER_TEMP/Minairo-6.35.1.apk"
          else
            gh release create minairo-6.35.1 "$RUNNER_TEMP/Minairo-6.35.1.apk" --target "$GITHUB_SHA" --title "Minairó 6.35.1" --notes "Premium por 1 €/mes, cobro único anual de 12 €. Formulario renovado y actualizaciones al abrir la app. versionCode 76, com.urysoft.minairo, certificado original. La activación comercial requiere configurar el servicio de Minairó."
          fi
