name: Validate and publish Foldery 1.6.3
on:
  push:
    branches: [main]
    paths:
      - 'release-parts/foldery-1.6.3/**'
      - '.github/workflows/publish-foldery-1.6.3.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check shadow pixels and alignment
        run: |
          chmod +x android/foldery/gradlew
          cd android/foldery
          ./gradlew testDebugUnitTest --tests '*ShadowBoundsAlignmentTest' --tests '*WidgetRowSurfaceTest' --tests '*WidgetTapFixTest.realCollectionItemsSendAppAndContactReferencesThroughTheWidgetTemplate' --no-daemon
          python3 tests/verify_locales.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foldery-shadow-alignment-validation
          path: |
            android/foldery/app/build/reports/tests/
            android/foldery/app/build/test-results/
            android/foldery/app/build/qa/
      - name: Assemble verified signed installer
        run: |
          cat release-parts/foldery-1.6.3/*.b64 | base64 -d > "$RUNNER_TEMP/Foldery-1.6.3.apk"
          python3 - "$RUNNER_TEMP/Foldery-1.6.3.apk" <<'PYCODE'
          import hashlib,json,sys
          expected=json.load(open('release-parts/foldery-1.6.3/update.json'))['sha256']
          assert hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()==expected
          PYCODE
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Foldery-1.6.3.apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -q '61246e557cb0944efa09018ef1ba50725f461d51990a38548e1fa3985cc11d91' "$RUNNER_TEMP/signature.txt"
      - name: Publish release and update website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view foldery-1.6.3 >/dev/null 2>&1; then
            gh release upload foldery-1.6.3 "$RUNNER_TEMP/Foldery-1.6.3.apk" --clobber
          else
            gh release create foldery-1.6.3 "$RUNNER_TEMP/Foldery-1.6.3.apk" --target "$GITHUB_SHA" --title 'Foldery 1.6.3' --notes 'Sombras compuestas por filas completas para evitar el recorte del escritorio entre iconos. Alineación en nueve posiciones, centro por defecto y desplazamiento accesible cuando el contenido no cabe. Firma original. versionCode 26.'
          fi
          git pull --ff-only origin main
          cp release-parts/foldery-1.6.3/update.json updates/foldery.json
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('assets/apps/foldery-copy.js')
          p.write_text(p.read_text().replace('1.6.2','1.6.3'))
          p=Path('index.html')
          p.write_text(p.read_text().replace('foldery-1.6.2/Foldery-1.6.2.apk','foldery-1.6.3/Foldery-1.6.3.apk').replace('version:"1.6.2"','version:"1.6.3"'))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/foldery.json assets/apps/foldery-copy.js index.html
          git diff --cached --quiet || git commit -m 'Publish Foldery 1.6.3 update feed and website version'
          git push origin main
