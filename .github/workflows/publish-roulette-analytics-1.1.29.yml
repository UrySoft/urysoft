name: Publish Roulette Analytics 1.1.29

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-roulette-analytics-1.1.29.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APK: descargas/roulette-analytics/Roulette-Analytics-1.1.29.apk
      TAG: roulette-analytics-1.1.29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the signed installer digest
        run: echo "58cd497c930fd9d831225d84bf15afa14299739c4665b9b5d1ca1e689a4c1327  $APK" | sha256sum -c -
      - name: Publish the Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --latest=false \
              --title "Roulette Analytics 1.1.29" \
              --notes "Descarga directa para Android. Comprobación de actualizaciones desde UrySoft. Si tienes instalada una versión anterior, desinstálala una vez y vuelve a entrar con la misma cuenta para conservar tus créditos."
          fi
