name: Verify UrySoft Simbolos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['simbolos/**', 'functions/api/simbolos/**', '.github/workflows/verify-simbolos.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node simbolos/test.mjs
      - name: Public web grid, data recovery and retired downloads
        shell: bash
        run: |
          set -eu
          base=https://urysoft.pages.dev
          work=$(mktemp -d)
          head -c 1024 /dev/urandom > "$work/original.bin"
          check_old_downloads() {
            for version in 0.1.0 0.1.1 0.2.0-preview 0.2.1; do
              target=$(curl -fsSL --max-time 12 -o /dev/null -w '%{url_effective}' "$base/simbolos/android/UrySoft-Simbolos-$version.apk") || return 1
              [[ "$target" == "$base/simbolos/" ]] || return 1
            done
          }
          for attempt in {1..25}; do
            if curl -fsS --max-time 20 -H 'Content-Type: application/octet-stream' --data-binary @"$work/original.bin" "$base/api/simbolos/v1/encode?level=3" -o "$work/page.png" &&
               curl -fsS --max-time 20 -H 'Content-Type: image/png' --data-binary @"$work/page.png" "$base/api/simbolos/v1/decode" -o "$work/recovered.bin" &&
               cmp -s "$work/original.bin" "$work/recovered.bin" &&
               curl -fsS "$base/simbolos/" -o "$work/index" && grep -q 'v=text2' "$work/index" && ! grep -qi '\.apk' "$work/index" &&
               check_old_downloads &&
               curl -fsS -H 'Content-Type: text/plain' --data-binary 'https://urysoft.com' "$base/api/simbolos/v1/encode?level=3&columns=10" -o "$work/text.png" &&
               test "$(od -An -tu4 --endian=big -j16 -N8 "$work/text.png" | xargs)" = '416 160' &&
               curl -fsS -H 'Content-Type: image/png' --data-binary @"$work/text.png" "$base/api/simbolos/v1/decode" | grep -Fxq 'https://urysoft.com'; then
              echo 'Verified web-only distribution and rectangular encoding'
              exit 0
            fi
            sleep 10
          done
          exit 1
