<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Símbolos · UrySoft</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2ec;color:#152f34;font:16px/1.45 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:22px}header{border-bottom:2px solid #25474b;margin-bottom:20px}h1{font-size:2rem;margin:.1em 0 .35em}label{display:block;margin:12px 0}button,select,input{font:inherit;max-width:100%}select,button{padding:9px;border:1px solid #215451;border-radius:6px}button{background:#14554d;color:white;cursor:pointer}button:disabled{opacity:.5}fieldset{background:white;border:1px solid #bac9c4;padding:16px;margin:16px 0;border-radius:9px}legend{font-weight:700}output{display:block;font-weight:600;min-height:1.5em}canvas{display:block;width:100%;height:auto;margin:8px auto;background:white}a{color:#14554d}[hidden]{display:none!important}
.entrada{padding:12px 0}.entrada+.entrada{border-top:1px solid #bac9c4}.entrada label{font-weight:650;margin:0 0 6px}.entrada button{display:block;margin-top:8px}textarea{display:block;width:100%;padding:8px;font:inherit}canvas.compact{width:auto;max-width:100%;height:auto}@media print{body{background:white}main{padding:0;max-width:none}main>*:not(canvas){display:none}canvas{width:210mm;height:297mm;margin:0}canvas.compact{width:var(--print-side);height:auto}@page{size:A4;margin:0}}
</style><main><header><small>UrySoft</small><h1>Símbolos</h1></header>
<label>Procesamiento <select id="mode"><option value="local">En este dispositivo</option><option value="web">Enviar al servicio web de UrySoft</option></select></label>
<fieldset><legend>Codificar</legend><label>Nivel <select id="level"><option value="1">1 · Blanco y negro · 469 bytes de contenido</option><option value="2">2 · Trazo de color · 790 bytes de contenido</option><option value="3" selected>3 · Trazo y fondo de color · 1.024 bytes de contenido</option></select></label>
<label>Forma de la imagen <select id="axis"><option value="auto">Automática</option><option value="columns">Fijar columnas</option><option value="rows">Fijar filas</option></select></label>
<label><input id="marks" type="checkbox" checked> Incluir márgenes y marcas de lectura</label>
<small>Para leer una fotografía, conserva las marcas. Para compartir solo las casillas, desactívalas y guarda la imagen a su tamaño original.</small>
<label id="fixedBox" hidden><span id="fixedLabel">Número de columnas</span> <input id="fixed" type="number" value="8" min="1" max="60" step="1"></label>
<div class="entrada"><label for="message">Escribir texto o pegar un enlace</label><textarea id="message" rows="3" placeholder="https://urysoft.com"></textarea><small id="textGrid" aria-live="polite"></small><button id="encodeText">Crear icono de texto</button></div>
<div class="entrada"><label for="source">Subir archivo</label><input id="source" type="file"><small id="fileGrid" aria-live="polite"></small><button id="encode">Crear página de archivo</button></div></fieldset>
<fieldset id="descodificar"><legend>Descodificar una página</legend><label>Imagen original o fotografía <input id="photo" type="file" accept="image/*"></label>
<button id="decode">Leer imagen</button> <button id="manual" hidden>Marcar los cuatro centros</button></fieldset>
<output id="status" aria-live="polite"></output><button id="save" hidden>Guardar</button>
<section id="resultText" hidden><label>Texto recuperado <textarea id="restored" readonly rows="3"></textarea></label><button id="copy">Copiar texto</button> <a id="open" hidden rel="noopener noreferrer">Abrir enlace</a></section>
<canvas id="view" hidden></canvas><p><a href="https://github.com/UrySoft/urysoft/tree/main/simbolos" target="_blank" rel="noopener">Documentación y código de la API</a></p></main>
<script type="module" src="ui.mjs?v=marks1"></script></html>
