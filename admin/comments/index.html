<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Comentarios · Administración UrySoft</title><style>body{font:16px/1.6 system-ui;background:#050b1d;color:#f1f5ff;max-width:960px;margin:30px auto;padding:20px}input,textarea,select,button{font:inherit;padding:12px;border-radius:8px}input,textarea,select{background:#101a30;color:inherit;border:1px solid #456}textarea{display:block;width:calc(100% - 26px);margin:12px 0}article{border:1px solid #456;border-radius:16px;padding:24px;margin:20px 0;overflow-wrap:anywhere}article p{white-space:pre-wrap}button{cursor:pointer;margin:6px}label{display:block}button:disabled{opacity:.5}a{color:#67e8f9}</style><h1>Comentarios de UrySoft</h1><p>Los mensajes nuevos son privados hasta que los apruebes. Puedes ocultarlos después y añadir o editar tu respuesta.</p><form id="login"><label>Clave privada de administración <input id="key" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><div id="tools" hidden><label>Filtrar <select id="filter"><option value="all">Todos</option><option value="pending" selected>Pendientes</option><option value="approved">Publicados</option><option value="hidden">Ocultos</option></select></label><button id="refresh">Actualizar</button><button id="logout">Salir</button></div><p id="status" role="status"></p><div id="list"></div><a href="/">Volver a UrySoft</a><script src="/assets/apps/admin-comments.js" defer></script></html>
